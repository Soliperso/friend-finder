<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friend Finder — Friends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg-1: #6a11cb;
      --bg-2: #2575fc;
      --bg-3: #ff5f9e;
      --glass: rgba(255, 255, 255, 0.12);
      --glass-strong: rgba(255, 255, 255, 0.2);
      --border: rgba(255, 255, 255, 0.28);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.78);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 36px 18px 60px;
      background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-2));
      background-size: 400% 400%;
      animation: gradientShift 16s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: var(--shadow);
    }

    .wrap { width: 100%; max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .back {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.92rem;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }
    .back:hover { opacity: 0.65; }

    .header {
      text-align: center;
      border-radius: 24px;
      padding: 30px 26px;
      margin-bottom: 24px;
      animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .header h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      letter-spacing: -0.02em;
    }
    .header p { color: var(--muted); margin-top: 8px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    .friend {
      border-radius: 22px;
      padding: 22px 18px;
      text-align: center;
      transition: transform 0.25s ease, background 0.25s ease;
      animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .friend:hover { transform: translateY(-5px); background: var(--glass-strong); }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 14px;
      display: block;
      border: 3px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      background: rgba(255, 255, 255, 0.12);
    }

    .friend .name {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .scores {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
    }
    .scores span {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid var(--border);
    }

    .loading, .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
      font-size: 1rem;
    }

    .footer-links {
      text-align: center;
      margin-top: 28px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .footer-links a { color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255, 255, 255, 0.4); }
    .footer-links a:hover { opacity: 0.7; }
    .footer-links .dot { margin: 0 10px; opacity: 0.5; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="/">← Home</a>
      <span class="back" style="opacity:.6;">🤝 Friend Finder</span>
    </div>

    <div class="header glass">
      <h1>Meet the Friends</h1>
      <p>Everyone you could be matched with, based on their personality answers.</p>
    </div>

    <div class="grid" id="grid">
      <div class="loading">Loading friends…</div>
    </div>

    <div class="footer-links">
      <a href="/survey">Take the Survey</a>
      <span class="dot">•</span>
      <a href="/api/friends" target="_blank" rel="noopener">Raw JSON</a>
      <span class="dot">•</span>
      <a href="https://github.com/Soliperso/friend-finder" target="_blank" rel="noopener">GitHub Repo</a>
    </div>
  </div>

  <script>
    var FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110"><rect width="100%" height="100%" fill="rgba(255,255,255,0.15)"/><text x="50%" y="54%" font-size="48" text-anchor="middle" dominant-baseline="middle">🙂</text></svg>'
    );

    fetch('/api/friends')
      .then(function (r) { return r.json(); })
      .then(function (friends) {
        var grid = document.getElementById('grid');
        grid.innerHTML = '';
        if (!friends.length) {
          grid.innerHTML = '<div class="empty">No friends yet — take the survey to add yourself!</div>';
          return;
        }
        friends.forEach(function (f, idx) {
          var card = document.createElement('div');
          card.className = 'friend glass';
          card.style.animationDelay = (idx * 0.05) + 's';

          var img = document.createElement('img');
          img.className = 'avatar';
          img.alt = f.name;
          img.src = f.profilePic || FALLBACK;
          img.onerror = function () { this.onerror = null; this.src = FALLBACK; };

          var name = document.createElement('div');
          name.className = 'name';
          name.textContent = f.name;

          var scores = document.createElement('div');
          scores.className = 'scores';
          (f.scores || []).forEach(function (s) {
            var pill = document.createElement('span');
            pill.textContent = s;
            scores.appendChild(pill);
          });

          card.appendChild(img);
          card.appendChild(name);
          card.appendChild(scores);
          grid.appendChild(card);
        });
      })
      .catch(function () {
        document.getElementById('grid').innerHTML =
          '<div class="empty">Could not load friends. Please try again.</div>';
      });
  </script>
</body>

</html>
