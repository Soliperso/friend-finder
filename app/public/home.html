<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friend Finder — Meet your match</title>
  <meta name="description" content="Answer a few questions and meet your new best friend, matched by personality." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg-1: #6a11cb;
      --bg-2: #2575fc;
      --bg-3: #ff5f9e;
      --glass: rgba(255, 255, 255, 0.12);
      --glass-strong: rgba(255, 255, 255, 0.18);
      --border: rgba(255, 255, 255, 0.28);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.78);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-2));
      background-size: 400% 400%;
      animation: gradientShift 16s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: var(--shadow);
    }

    .hero {
      width: 100%;
      max-width: 640px;
      border-radius: 28px;
      padding: 48px 40px;
      text-align: center;
      animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      font-size: 38px;
      border-radius: 22px;
      margin-bottom: 22px;
      background: var(--glass-strong);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(2.1rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin-bottom: 14px;
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      color: var(--muted);
      max-width: 440px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: #2b1066;
      text-decoration: none;
      padding: 16px 34px;
      border-radius: 16px;
      background: linear-gradient(135deg, #ffffff, #f0e9ff);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .cta:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.32);
    }

    .cta:active { transform: translateY(-1px) scale(0.99); }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 38px;
    }

    .feature {
      border-radius: 18px;
      padding: 20px 14px;
      text-align: center;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .feature:hover { transform: translateY(-4px); background: var(--glass-strong); }

    .feature .emoji { font-size: 26px; display: block; margin-bottom: 10px; }

    .feature .step {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .feature .label {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 0.92rem;
    }

    footer {
      margin-top: 26px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      padding-bottom: 1px;
      transition: opacity 0.2s ease;
    }

    footer a:hover { opacity: 0.75; }

    footer .dot { margin: 0 10px; opacity: 0.5; }

    @media (max-width: 520px) {
      .hero { padding: 38px 24px; }
      .features { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="hero glass">
    <div class="badge">🤝</div>
    <h1>Friend Finder</h1>
    <p class="tagline">Answer a few quick questions and we'll match your personality to your new best friend.</p>
    <a class="cta" href="/survey">Take the Survey →</a>

    <div class="features">
      <div class="feature glass">
        <span class="emoji">📝</span>
        <div class="step">Step 1</div>
        <div class="label">Answer 10 questions</div>
      </div>
      <div class="feature glass">
        <span class="emoji">🧠</span>
        <div class="step">Step 2</div>
        <div class="label">We compare personalities</div>
      </div>
      <div class="feature glass">
        <span class="emoji">🎉</span>
        <div class="step">Step 3</div>
        <div class="label">Meet your match</div>
      </div>
    </div>
  </main>

  <footer>
    <a href="/friends">Browse Friends</a>
    <span class="dot">•</span>
    <a href="https://github.com/Soliperso/friend-finder" target="_blank" rel="noopener">GitHub Repo</a>
  </footer>
</body>

</html>
